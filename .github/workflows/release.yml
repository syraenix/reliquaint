name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create tags + releases, upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and whether to release
        id: gate
        run: |
          PKG=$(jq -r .version launcher/package.json)
          CONF=$(jq -r .version launcher/src-tauri/tauri.conf.json)
          CARGO=$(grep -m1 '^version = ' launcher/src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json=$PKG  tauri.conf.json=$CONF  Cargo.toml=$CARGO"
          if [ "$PKG" != "$CONF" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::Version mismatch across package.json / tauri.conf.json / Cargo.toml"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$PKG" >/dev/null 2>&1; then
            echo "Tag v$PKG already exists — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v3
        if: steps.gate.outputs.should_release == 'true'
        with:
          version: 11
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.should_release == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.should_release == 'true'

      - name: Install Tauri system dependencies
        if: steps.gate.outputs.should_release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.should_release == 'true'
        with:
          workspaces: launcher

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.should_release == 'true'
        working-directory: launcher

      - name: Build and publish release
        if: steps.gate.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tagName: v${{ steps.gate.outputs.version }}
          releaseName: Reliquaint v${{ steps.gate.outputs.version }}
          releaseBody: "Automated release. Built from ${{ github.sha }}."
          releaseDraft: false
          prerelease: false
          args: --bundles deb,appimage
