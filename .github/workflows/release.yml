name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tags + releases, upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # Build each architecture natively (Tauri's WebKitGTK linking makes x86->ARM
    # cross-compilation fragile). Both legs attach their bundles to the release that
    # release-please already created when it pushed the tag.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            bundles: deb,appimage,rpm
          - runner: ubuntu-24.04-arm
            bundles: deb,rpm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and whether to release
        id: gate
        run: |
          # Cargo.toml is the single source of truth for the app version (see #44);
          # release-please bumps it and pushes the matching v<version> tag.
          CARGO=$(grep -m1 '^version = ' launcher/src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "Cargo.toml=$CARGO  ref=$GITHUB_REF"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$CARGO" ]; then
              echo "::error::Tag v$VERSION does not match Cargo.toml version $CARGO"
              exit 1
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: release the current Cargo.toml version unless already tagged.
            VERSION="$CARGO"
            if git rev-parse "v$VERSION" >/dev/null 2>&1; then
              echo "Tag v$VERSION already exists — skipping release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v3
        if: steps.gate.outputs.should_release == 'true'
        with:
          version: 11
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.should_release == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.should_release == 'true'

      - name: Install Tauri system dependencies
        if: steps.gate.outputs.should_release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.should_release == 'true'
        with:
          workspaces: launcher

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.should_release == 'true'
        working-directory: launcher

      # release-please already created the GitHub Release (with changelog body) when it
      # pushed the tag; tauri-action attaches the built bundles to that existing release.
      - name: Build and publish release
        if: steps.gate.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tagName: v${{ steps.gate.outputs.version }}
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
