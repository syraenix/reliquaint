schema_version = 1

[game]
id         = "kq4"
title      = "King's Quest IV: The Perils of Rosella"
platform   = "dos"
collection = "kings-quest"

[meta]
year        = 1988
developer   = "Sierra On-Line"
publisher   = "Sierra On-Line"
genre       = ["adventure"]
tags        = ["sierra", "sci", "fantasy", "parser"]
description = "The series' first SCI entry and first female protagonist. Princess Rosella's day-and-night quest to save her dying father."

[acquisition]
steam = "https://store.steampowered.com/app/10100"
notes = "Bundled in King's Quest Collection on Steam (app 10100)."

[install]
expects_files = ["SCIV.EXE"]

[runtime]
emulator = "dosbox-staging"
sidecars = ["fluidsynth"]

[runtime.dosbox]
config = "kq4.conf"
entry  = "SCIV.EXE"
mount  = "c"
