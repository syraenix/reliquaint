schema_version = 1

[game]
id         = "kq5"
title      = "King's Quest V: Absence Makes the Heart Go Yonder!"
platform   = "dos"
collection = "kings-quest"

[meta]
year        = 1990
developer   = "Sierra On-Line"
publisher   = "Sierra On-Line"
genre       = ["adventure"]
tags        = ["sierra", "sci", "fantasy", "point-and-click"]
description = "The first VGA + point-and-click King's Quest. CD versions added voice acting; this DOS release uses the original 256-color visuals."

[acquisition]
steam = "https://store.steampowered.com/app/10100"
notes = "Bundled in King's Quest Collection on Steam (app 10100)."

[install]
expects_files = ["SIERRA.EXE"]

[runtime]
emulator = "dosbox-staging"
sidecars = ["fluidsynth"]

[runtime.dosbox]
config = "kq5.conf"
entry  = "SIERRA.EXE"
mount  = "c"
