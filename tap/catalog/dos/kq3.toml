schema_version = 1

[game]
id         = "kq3"
title      = "King's Quest III: To Heir Is Human"
platform   = "dos"
collection = "kings-quest"

[meta]
year        = 1986
developer   = "Sierra On-Line"
publisher   = "Sierra On-Line"
genre       = ["adventure"]
tags        = ["sierra", "agi", "fantasy", "parser"]
description = "Gwydion, slave to the wizard Manannan, must find his way to freedom. AGI parser game with a strict timer mechanic for the wizard's return."

[acquisition]
steam = "https://store.steampowered.com/app/10100"
notes = "Bundled in King's Quest Collection on Steam (app 10100)."

[install]
expects_files = ["SIERRA.COM"]

[runtime]
emulator = "dosbox-staging"
sidecars = ["fluidsynth"]

[runtime.dosbox]
config = "kq3.conf"
entry  = "SIERRA.COM"
mount  = "c"
