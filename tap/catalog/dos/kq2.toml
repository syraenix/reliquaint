schema_version = 1

[game]
id         = "kq2"
title      = "King's Quest II: Romancing the Throne"
platform   = "dos"
collection = "kings-quest"

[meta]
year        = 1985
developer   = "Sierra On-Line"
publisher   = "Sierra On-Line"
genre       = ["adventure"]
tags        = ["sierra", "agi", "fantasy", "parser"]
description = "Sir Graham, now King of Daventry, must rescue Princess Valanice from Hagatha's island. AGI parser game."

[acquisition]
steam = "https://store.steampowered.com/app/10100"
notes = "Bundled in King's Quest Collection on Steam (app 10100)."

[install]
expects_files = ["SIERRA.COM"]

[runtime]
emulator = "dosbox-staging"
sidecars = ["fluidsynth"]

[runtime.dosbox]
config = "kq2.conf"
entry  = "SIERRA.COM"
mount  = "c"
