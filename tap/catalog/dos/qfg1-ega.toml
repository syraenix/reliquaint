schema_version = 1

[game]
id         = "qfg1-ega"
title      = "Quest for Glory I: So You Want to Be a Hero (EGA)"
platform   = "dos"
collection = "quest-for-glory"

[meta]
year        = 1989
developer   = "Sierra On-Line"
publisher   = "Sierra On-Line"
genre       = ["adventure", "rpg"]
tags        = ["sierra", "sci", "fantasy", "parser"]
description = "Sierra's hybrid of adventure game and stat-based RPG. Originally released as Hero's Quest; this is the first EGA edition with the SCI parser interface."

[acquisition]
gog   = "https://www.gog.com/en/game/quest_for_glory"
notes = "Bundled in the Quest for Glory 1-5 collection on GOG."

[install]
expects_files = ["SCIV.exe"]
subdir = "EGA"

[runtime]
emulator = "dosbox-staging"
sidecars = ["fluidsynth"]

[runtime.dosbox]
config = "qfg1-ega.conf"
entry  = "SCIV.exe"
mount  = "c"
