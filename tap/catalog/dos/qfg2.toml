schema_version = 1

[game]
id         = "qfg2"
title      = "Quest for Glory II: Trial by Fire"
platform   = "dos"
collection = "quest-for-glory"

[meta]
year        = 1990
developer   = "Sierra On-Line"
publisher   = "Sierra On-Line"
genre       = ["adventure", "rpg"]
tags        = ["sierra", "sci", "arabian", "parser"]
description = "Continues the Hero's story in an Arabian-inspired setting. EGA-era SCI parser game; no official VGA remake exists, though the AGD Interactive fan remake is well-known."

[acquisition]
gog   = "https://www.gog.com/en/game/quest_for_glory"
notes = "Bundled in the Quest for Glory 1-5 collection on GOG."

[install]
expects_files = ["sciv.exe"]

[runtime]
emulator = "dosbox-staging"
sidecars = ["fluidsynth"]

[runtime.dosbox]
config = "qfg2.conf"
entry  = "sciv.exe"
mount  = "c"
