schema_version = 1

[game]
id         = "kq1sci"
title      = "King's Quest I: Quest for the Crown (SCI remake)"
platform   = "dos"
collection = "kings-quest"

[meta]
year        = 1990
developer   = "Sierra On-Line"
publisher   = "Sierra On-Line"
genre       = ["adventure"]
tags        = ["sierra", "sci", "fantasy", "parser"]
description = "The 1990 SCI remake of the 1984 AGI original. Sir Graham's quest to recover the three magical artifacts of Daventry."

[acquisition]
steam = "https://store.steampowered.com/app/10100"
notes = "Bundled in King's Quest Collection on Steam (app 10100)."

[install]
expects_files = ["SCIV.EXE"]

[runtime]
emulator = "dosbox-staging"
sidecars = ["fluidsynth"]

[runtime.dosbox]
config = "kq1sci.conf"
entry  = "SCIV.EXE"
mount  = "c"
