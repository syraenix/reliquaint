schema_version = 1

[game]
id         = "kq6"
title      = "King's Quest VI: Heir Today, Gone Tomorrow"
platform   = "dos"
collection = "kings-quest"

[meta]
year        = 1992
developer   = "Sierra On-Line"
publisher   = "Sierra On-Line"
genre       = ["adventure"]
tags        = ["sierra", "sci", "fantasy", "point-and-click", "voice-acted"]
description = "Often regarded as the high-water mark of the series. Full voice acting in the CD version, FMV intro by Kelly Rowan, and multiple endings."

[acquisition]
steam = "https://store.steampowered.com/app/10110"
notes = "Bundled in King's Quest 4+5+6 on Steam (app 10110)."

[install]
expects_files = ["DOKQ6.EXE", "RESOURCE.000"]

[runtime]
emulator = "dosbox-staging"
sidecars = ["fluidsynth"]

[runtime.dosbox]
config = "kq6.conf"
entry  = "DOKQ6.EXE"
mount  = "c"
