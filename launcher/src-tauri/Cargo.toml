[package]
name = "classic-launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "classic-launcher"
path = "src/main.rs"

[lib]
name = "classic_launcher"
path = "src/lib.rs"

[dependencies]
clap        = { version = "4.5", features = ["derive"] }
serde       = { version = "1.0", features = ["derive"] }
toml        = "0.8"
anyhow      = "1.0"
thiserror   = "1.0"
shellexpand = "3.1"
zip         = "0.6"
tempfile    = "3.10"

[dev-dependencies]
assert_cmd  = "2.0"
predicates  = "3.1"
anyhow      = "1.0"
